name: Coco — Short final de 60 segundos (Wan 2.2)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/generate-coco-short-60s.yml'
  schedule:
    # Cada 8 horas: 00:30, 08:30 y 16:30 en Nuevo León (UTC-6).
    - cron: "30 6,14,22 * * *"
  workflow_dispatch:
    inputs:
      confirm:
        description: Escribe GENERAR para reanudar o continuar las escenas
        required: true
        default: GENERAR
        type: string
permissions:
  actions: read
  contents: read
concurrency:
  group: coco-short-60s
  cancel-in-progress: false
jobs:
  render-short:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || inputs.confirm == 'GENERAR' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4
      - name: Recuperar escenas de la ejecución anterior
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p output
          PREVIOUS_RUN_ID="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '[.artifacts[] | select(.name == "Coco-Short-60s-build" and .expired == false and .workflow_run.id != ('"$GITHUB_RUN_ID"'))] | sort_by(.created_at) | last | .workflow_run.id // empty')"
          if [ -n "$PREVIOUS_RUN_ID" ]; then
            echo "Recuperando el último artefacto válido del intento $PREVIOUS_RUN_ID"
            gh run download "$PREVIOUS_RUN_ID" --name Coco-Short-60s-build --dir output
          else
            echo "No hay artefactos anteriores válidos para recuperar."
          fi
          mkdir -p output/parts
          find output/parts -maxdepth 1 -name 'part-*.mp4' -type f -printf '%f\n' | sort || true
      - name: Descargar referencia privada de Coco
        env:
          GH_READ_TOKEN: ${{ secrets.GH_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_READ_TOKEN:-}" ]; then
            echo "::error::Falta GH_READ_TOKEN."
            exit 1
          fi
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_READ_TOKEN" \
            -H "Accept: application/vnd.github.raw+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/andrepriv2009-del/coco-monito-espacial/contents/coco-referencia.webp?ref=main" \
            -o coco-referencia.webp
          test -s coco-referencia.webp
      - name: Instalar FFmpeg y fuentes
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar generador Wan, voz y audio
        run: |
          python -m pip install --upgrade pip
          python -m pip install gradio_client edge-tts numpy
      - name: Generar escenas pendientes y ensamblar Short de 60 segundos
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: |
          python scripts/generate_coco_short.py
      - name: Guardar avance y resultado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Coco-Short-60s-build
          path: output/
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
