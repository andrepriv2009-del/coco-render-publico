name: LEGACY — renderizador Blender integrado en producción diaria

# La producción diaria ejecuta video/render_coco.py desde
# coco-daily-production.yml. Este flujo histórico queda inerte para evitar
# renders duplicados y no consulta ni modifica D1.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: Flujo histórico desactivado
        run: echo "El render 3D se ejecuta exclusivamente desde coco-daily-production.yml."
