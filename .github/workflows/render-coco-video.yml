name: LEGACY — renderizador Blender desactivado

# Este flujo se conserva solo como referencia histórica.
# La producción aprobada es Hugging Face Wan 2.2; no ejecutar Blender,
# no consumir minutos de Actions y no modificar episodios de D1 desde aquí.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: Flujo retirado
        run: echo "Este renderizador está desactivado. Usa el flujo Hugging Face Wan 2.2."
