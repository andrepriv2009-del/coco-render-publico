name: Coco — Producción diaria automática
on:
  # Un render programado al día (00:30 hora de Nuevo León, UTC-6).
  # Se evita multiplicar minutos de Actions en el plan gratuito.
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:
  # Ejecutar una producción al actualizar el motor visual, sin depender del equipo local.
  push:
    branches: [main]
    paths:
      - "video/render_coco.py"
      - "scripts/generate_daily_coco.py"
      - ".github/workflows/coco-daily-production.yml"
permissions:
  contents: read
  actions: read
concurrency:
  # Separar la prueba nueva del render antiguo atascado, sin cancelarlo.
  group: coco-daily-production-wan-test
  cancel-in-progress: false
jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4
      - name: Descargar referencia oficial de Coco
        env:
          GH_READ_TOKEN: ${{ secrets.GH_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_READ_TOKEN:-}" ]; then
            echo "::warning::GH_READ_TOKEN no está configurado. Se usará el diseño procedural versionado en Blender."
            exit 0
          fi
          if curl --fail --silent --show-error --retry 3 --retry-delay 2 \
            -H "Authorization: Bearer $GH_READ_TOKEN" \
            -H "Accept: application/vnd.github.raw+json" \
            "https://api.github.com/repos/andrepriv2009-del/coco-monito-espacial/contents/coco-referencia.webp?ref=main" \
            -o coco-referencia.webp && [ -s coco-referencia.webp ]; then
            echo "Referencia visual descargada correctamente."
          else
            rm -f coco-referencia.webp
            echo "::warning::No se pudo descargar la referencia privada. Blender conservará la identidad mediante el diseño procedural versionado."
          fi
      - name: Instalar Blender y herramientas gratuitas
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends blender ffmpeg libass9 fonts-dejavu-core libegl1 libgl1 espeak-ng
          blender --version | head -n 1
          ffmpeg -hide_banner -filters 2>&1 | grep -q subtitles
          python -m pip install --upgrade pip
          python -m pip install numpy pillow edge-tts gradio_client
      - name: Validar sintaxis del pipeline
        run: |
          python -m py_compile scripts/generate_daily_coco.py video/render_coco.py
          test "$(grep -Ec '^    - cron:' .github/workflows/coco-daily-production.yml)" -eq 1
          echo "WORKFLOW_CONFIG_VALIDATED=1"
      - name: Generar episodio 3D, voz mexicana, música y subtítulos
        env:
          PYTHONUNBUFFERED: "1"
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/generate_daily_coco.py
      - name: Guardar MP4, SRT, episodio y reporte
        uses: actions/upload-artifact@v4
        with:
          name: Coco-video-diario-${{ github.run_number }}
          path: |
            output/Coco-Short-60s-FINAL.mp4
            output/subtitles.srt
            output/subtitles.ass
            output/episode.json
            output/production-report.json
          if-no-files-found: error
          retention-days: 30
      - name: Publicar automáticamente el MP4 en YouTube
        env:
          GH_ACTION_TOKEN: ${{ github.token }}
          WORKER_URL: https://coco-monito-espacial.andrepriv2009.workers.dev
        run: |
          set -euo pipefail
          test -s output/Coco-Short-60s-FINAL.mp4
          EPISODE_ID="$(python -c 'import json; print(json.load(open("output/episode.json", encoding="utf-8"))["id"])')"
          VIDEO_TITLE="$(python -c 'import json; print(json.load(open("output/episode.json", encoding="utf-8"))["title"])')"
          RESPONSE="$(curl --fail-with-body --silent --show-error \
            --retry 2 --retry-all-errors --retry-delay 5 --max-time 900 \
            -X POST "${WORKER_URL}/youtube/auto-upload" \
            -H "Authorization: Bearer ${GH_ACTION_TOKEN}" \
            -H "X-GitHub-Run-Id: ${GITHUB_RUN_ID}" \
            -H "X-GitHub-Run-SHA: ${GITHUB_SHA}" \
            -H "X-Episode-Id: ${EPISODE_ID}" \
            -H "X-Video-Title: ${VIDEO_TITLE}" \
            -H "Content-Type: video/mp4" \
            --data-binary "@output/Coco-Short-60s-FINAL.mp4")"
          echo "$RESPONSE"
          echo "$RESPONSE" | jq -e '.uploaded == true' >/dev/null
          echo "YOUTUBE_AUTO_UPLOAD_CONFIRMED=1"
