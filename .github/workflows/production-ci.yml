name: Coco — CI de producción
on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "production/**"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: coco-production-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validar sintaxis
        run: |
          python -m py_compile scripts/generate_daily_coco.py video/render_coco.py tests/test_production_contract.py
      - name: Ejecutar pruebas del contrato de producción
        run: python -m unittest discover -s tests -v
